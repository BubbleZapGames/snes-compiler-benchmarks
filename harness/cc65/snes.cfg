# 32 KB SNES LoROM for cc65. Bank 0 maps $0000-$1FFF to low WRAM and
# $8000-$FFFF to ROM, which is all a 16-bit 6502 address space can see.
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0400;
    __STACKSTART__: type = weak, value = $1F00;
}
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw, define = yes;
    RAM:  start = $0200, size = $1F00 - $0400 - $0200, type = rw, define = yes;
    ROM:  start = $8000, size = $7FC0, type = ro, file = %O, fill = yes, fillval = $00;
    HDR:  start = $FFC0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
    VEC:  start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    STARTUP:  load = ROM, type = ro;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    ONCE:     load = ROM, type = ro, optional = yes;
    DATA:     load = ROM, run = RAM, type = rw, define = yes;
    BSS:      load = RAM, type = bss, define = yes;
    HEADER:   load = HDR, type = ro;
    VECTORS:  load = VEC, type = ro;
}
