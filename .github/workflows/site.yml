# Build the site from the committed results and publish it to GitHub Pages.
# No compilers are needed: results/ is produced by `python3 -m scb run` locally.
name: site

on:
  push:
    branches: [main]
    paths: ["results/**", "suite/**", "site/**", "scb/**", "toolchains.toml", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest && python3 -m pytest -q tests
      - run: python3 -m scb site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
